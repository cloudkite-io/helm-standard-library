{{ range $appName, $appConfig := .Values.apps }}
{{- $appValues := dict
      "component"           $appName
      "Values"              $.Values
      "Release"             $.Release
      "labels" (default (dict) $.Values.labels)
    -}}
{{- if $appConfig.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $appName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "standard-app.labels" $appValues | nindent 2 }}
spec:
  {{- if $appConfig.pdb.minAvailable }}
  minAvailable: {{ $appConfig.pdb.minAvailable }}
  {{- else if $appConfig.pdb.maxUnavailable }}
  maxUnavailable: {{ $appConfig.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $appName }}
{{- end }}
{{- end }}
